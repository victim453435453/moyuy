<!DOCTYPE html>
<html><body>
<h1 id="s">Running...</h1>
<script>
// Hafızayı ölçerek crash noktasını bul
var log = [];

var wCode = `
  function f(o) { return o.x + o.y; }
  for(var i=0;i<200000;i++) f({x:1.1,y:2.2});
  while(true) {
    f({x:1,y:2});
    f({x:"a",y:"b"});
    f({x:1.1,y:2.2});
  }
`;
var u = URL.createObjectURL(
  new Blob([wCode],{type:'text/javascript'})
);
for(var i=0;i<4;i++) new Worker(u);

function f(o){return o.x+o.y;}
for(var i=0;i<200000;i++) f({x:1.1,y:2.2});

var n=0;
function run(){
  try {
    for(var i=0;i<10000;i++){
      f({x:1,y:2});
      f({x:"str",y:"str"});
      f({x:{},y:{}});
    }
    n++;
    document.getElementById('s').textContent='iter:'+n;
    setTimeout(run,0);
  } catch(e) {
    document.getElementById('s').textContent='EXCEPTION: '+e;
  }
}
run();
</script>
</body></html>
