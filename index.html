<!DOCTYPE html>
<html><body>
<h1 id="s">Testing...</h1>
<script>
// SSV allocation test
history.replaceState("dummy", "");
history.pushState({x: new Array(1000).fill(1.1)}, "", "#test1");
history.pushState({x: new Array(1000).fill(1.1)}, "", "#test2");

var input = document.createElement("input");
document.body.appendChild(input);

var blurCount = 0;
input.addEventListener("blur", function() {
  blurCount++;
  document.getElementById('s').textContent = 
    'blur fired: ' + blurCount + ' | state: ' + JSON.stringify(history.state);
});

input.addEventListener("focus", function() {
  history.back();
});

document.addEventListener("popstate", function(e) {
  document.getElementById('s').textContent += ' | pop: ' + JSON.stringify(e.state).substring(0,50);
});

input.focus();
</script>
</body></html>
