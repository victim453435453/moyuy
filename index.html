<!DOCTYPE html>
<html><body>
<h1 id="s">Running...</h1>
<script>
var wCode = `
  function leak(o) {
    return o.a + o.b + o.c + o.d;
  }
  // JIT compile
  for (var i = 0; i < 300000; i++)
    leak({a:1.1,b:2.2,c:3.3,d:4.4});

  // GC pressure + JIT aynı anda
  while(true) {
    var arr = [];
    for (var i = 0; i < 10000; i++)
      arr.push({a:i,b:i+1,c:i+2,d:i+3});
    leak(arr[0]);
    arr = null;
  }
`;

var blob = new Blob([wCode],{type:'text/javascript'});
var u = URL.createObjectURL(blob);
for (var i = 0; i < 6; i++) new Worker(u);

// Ana thread: GC zorla
function leak(o){return o.a+o.b+o.c+o.d;}
for (var i=0;i<300000;i++) leak({a:1.1,b:2.2,c:3.3,d:4.4});

var tick = 0;
function gcStress() {
  var big = new Array(100000).fill({a:1.1,b:2.2,c:3.3,d:4.4});
  big.forEach(leak);
  big = null;
  tick++;
  if (tick < 200) setTimeout(gcStress, 0);
  else document.getElementById('s').textContent = 'Done - no crash';
}
gcStress();
</script>
</body></html>
